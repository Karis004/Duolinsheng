services:
  run:
    build: .
    restart: always
    environment:
      DUOLINSHENG_DATA_DIR: /app/data
    ports:
      - "8081:80"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:80/', timeout=3).close()"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    volumes:
      - type: bind
        source: ./data
        target: /app/data
        bind:
          create_host_path: false
      - type: bind
        source: ./SendKey.py
        target: /app/SendKey.py
        read_only: true
        bind:
          create_host_path: false
